services:
  studio-sm:
    build: .
    container_name: studio-sm
    restart: unless-stopped
    env_file: .env.local
    # A VPS não tem mais faixas livres para redes novas do compose; a bridge padrão basta (só expõe no localhost).
    network_mode: bridge
    ports:
      - "127.0.0.1:3036:3000"
